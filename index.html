<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef3ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon.svg"><title>Lift Log</title><link rel="stylesheet" href="./src/styles.css">
</head>
<body><main class="app-shell">
  <header id="home-header"><div class="header-top"><h1>Lift Log</h1><div class="header-actions"><button id="statistics" class="icon-button" type="button" aria-label="Statistics" title="Statistics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg></button><button id="settings" class="icon-button" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5ZM19.4 13.5a7.8 7.8 0 0 0 .05-1.5 7.8 7.8 0 0 0-.05-1.5l2-1.55-2-3.46-2.36.95a7.45 7.45 0 0 0-2.6-1.5L14.1 2h-4.2l-.34 2.94a7.45 7.45 0 0 0-2.6 1.5L4.6 5.49l-2 3.46 2 1.55a7.8 7.8 0 0 0-.05 1.5 7.8 7.8 0 0 0 .05 1.5l-2 1.55 2 3.46 2.36-.95a7.45 7.45 0 0 0 2.6 1.5L9.9 22h4.2l.34-2.94a7.45 7.45 0 0 0 2.6-1.5l2.36.95 2-3.46-2-1.55Z"/></svg></button></div></div></header>
  <section id="home-view"><div class="section-heading"><div><p class="eyebrow">YOUR ROUTINES</p><h2>Workouts</h2></div><button id="new-template" class="icon-button" aria-label="Add workout template" title="Add workout template">+</button></div><div id="template-list"></div></section>
  <section id="template-view" hidden><button class="back" data-back="home">← Back</button><div class="section-heading"><div><p class="eyebrow">WORKOUT TEMPLATE</p><h2 id="template-title"></h2></div></div><h3 class="template-exercises-heading">Exercises</h3><div id="template-exercise-list"></div><div class="button-row"><button id="start-template" class="primary">Start workout</button><button id="edit-template" class="secondary">Edit</button><button id="delete-template" class="secondary danger">Delete</button></div></section>
  <section id="template-form-view" hidden><button class="back" data-back="home">← Back</button><p class="eyebrow">WORKOUT TEMPLATE</p><h2 id="template-form-heading">New template</h2><form id="template-form"><input id="template-id" type="hidden"><label>Template name<input id="template-name" maxlength="50" required placeholder="e.g. Upper body"></label><div id="template-exercises"></div><button id="add-template-exercise" type="button" class="secondary">Add exercise</button><button type="submit" class="primary">Save template</button></form><p id="template-note" class="notice" role="status"></p></section>
  <section id="workout-view" hidden><button id="workout-back" class="back">← Back</button><p class="eyebrow">CURRENT WORKOUT</p><h2 id="workout-title"></h2><p id="session-start" class="subtle"></p><div id="exercise-list"></div><div id="guard-actions" class="guard" hidden><p>Finish this active workout before returning home.</p><button id="guard-save" class="primary">Save workout</button><button id="guard-discard" class="secondary danger">Discard workout</button></div><button id="save-workout" class="primary">Save workout</button><p id="save-note" class="notice" role="status"></p></section>
  <section id="statistics-view" hidden><button class="back" data-back="home">← Back</button><div class="section-heading"><div><p class="eyebrow">YOUR HISTORY</p><h2>Statistics</h2></div><select id="chart-exercise" aria-label="Choose exercise"></select></div><div class="chart-card"><canvas id="progress-chart" width="360" height="220" aria-label="Exercise weight history"></canvas><p id="chart-empty" class="subtle">Complete a workout to see progress here.</p></div><h3>Completed workouts</h3><div id="overview-list"></div></section>
  <section id="settings-view" hidden><button class="back" data-back="home">← Back</button><p class="eyebrow">PREFERENCES</p><h2>Settings</h2><label class="theme-control" for="theme-preference">Colour theme<select id="theme-preference"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></section>
</main><template id="exercise-template"><article class="exercise-card"><h3></h3><p class="previous"></p><div class="sets"></div></article></template><script type="module" src="./src/app.js"></script></body></html>
