<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon.svg"><title>Lift Log</title><link rel="stylesheet" href="./src/styles.css"></head><body><main class="app-shell"><header><p class="eyebrow">OFFLINE LIFT LOG</p><h1>Train your way.</h1><p class="subtle">Everything stays on this iPhone.</p></header><nav aria-label="Main navigation"><button class="tab active" data-view="workout">Workout</button><button class="tab" data-view="progress">Progress</button></nav><section id="workout-view"><form id="workout-form"><label>Workout name<input id="workout-name" maxlength="50" placeholder="e.g. Upper body" required></label><label>Date<input id="workout-date" type="date" required></label><div id="exercise-list" aria-live="polite"></div><div class="add-exercise"><input id="exercise-name" maxlength="60" placeholder="Add an exercise"><button type="button" id="add-exercise-btn">Add</button></div><button class="primary" type="submit">Save workout</button></form><p id="save-note" class="notice" role="status"></p></section><section id="progress-view" hidden><div class="section-heading"><div><p class="eyebrow">YOUR HISTORY</p><h2>Progress</h2></div><select id="chart-exercise" aria-label="Choose exercise"></select></div><div class="chart-card"><canvas id="progress-chart" width="360" height="220" aria-label="Exercise weight history"></canvas><p id="chart-empty" class="subtle">Save a workout to see progress here.</p></div><div id="history-list"></div></section></main><template id="exercise-template"><article class="exercise-card"><div class="exercise-top"><div><h3></h3><p class="previous"></p></div><div class="reorder"><button type="button" class="move-up" aria-label="Move exercise up">↑</button><button type="button" class="move-down" aria-label="Move exercise down">↓</button><button type="button" class="remove danger">Remove</button></div></div><div class="sets"></div><button type="button" class="add-set secondary">+ Add set</button><p class="suggestion"></p></article></template><script type="module" src="./src/app.js"></script></body></html>
